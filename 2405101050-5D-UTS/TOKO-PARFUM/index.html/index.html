<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AromaCraft – Toko Parfum &amp; Custom Fragrance</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Ilustrasi botol & wallpaper (SVG inline). Warna botol diatur lewat CSS: --c1 / --c2 pada .art -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <!-- Botol bulat -->
        <symbol id="bottle-round" viewBox="0 0 120 120">
            <rect x="48" y="8" width="24" height="16" rx="4" fill="#d9b46a"/>
            <rect x="53" y="24" width="14" height="11" fill="#b8903f"/>
            <rect x="22" y="35" width="76" height="76" rx="32" style="fill:var(--c1)"/>
            <ellipse cx="40" cy="62" rx="6" ry="20" fill="#fff" opacity=".3"/>
            <rect x="40" y="64" width="40" height="24" rx="5" style="fill:var(--c2)" opacity=".92"/>
            <rect x="46" y="72" width="28" height="3" rx="1.5" fill="#fff" opacity=".8"/>
            <rect x="52" y="79" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/>
        </symbol>
        <!-- Botol tinggi -->
        <symbol id="bottle-tall" viewBox="0 0 120 120">
            <rect x="51" y="5" width="18" height="18" rx="3" fill="#d9b46a"/>
            <rect x="55" y="23" width="10" height="9" fill="#b8903f"/>
            <rect x="36" y="32" width="48" height="82" rx="10" style="fill:var(--c1)"/>
            <rect x="42" y="38" width="6" height="70" rx="3" fill="#fff" opacity=".28"/>
            <rect x="45" y="58" width="36" height="30" rx="4" style="fill:var(--c2)" opacity=".92"/>
            <circle cx="63" cy="68" r="4" fill="#fff" opacity=".85"/>
            <rect x="51" y="77" width="24" height="3" rx="1.5" fill="#fff" opacity=".7"/>
        </symbol>
        <!-- Botol pipih / kotak -->
        <symbol id="bottle-flat" viewBox="0 0 120 120">
            <rect x="42" y="8" width="36" height="16" rx="3" fill="#d9b46a"/>
            <rect x="53" y="24" width="14" height="10" fill="#b8903f"/>
            <rect x="14" y="34" width="92" height="76" rx="14" style="fill:var(--c1)"/>
            <rect x="22" y="42" width="76" height="60" rx="9" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
            <polygon points="22,92 52,42 70,42 34,102" fill="#fff" opacity=".18"/>
            <rect x="42" y="62" width="36" height="20" rx="4" style="fill:var(--c2)" opacity=".92"/>
        </symbol>
        <!-- Wallpaper banner dasbor (koordinat mengikuti viewBox 0 0 800 240) -->
        <g id="wall">
            <circle cx="90" cy="40" r="120" fill="#fff" opacity=".07"/>
            <circle cx="700" cy="220" r="150" fill="#fff" opacity=".08"/>
            <circle cx="430" cy="-20" r="90" fill="#e6a23c" opacity=".16"/>
            <path d="M0 190 C140 120 260 250 400 180 S660 110 800 170 V240 H0Z" fill="#fff" opacity=".07"/>
            <path d="M0 215 C160 160 280 260 430 205 S680 150 800 200" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
            <use href="#bottle-tall" x="560" y="40" width="120" height="120" style="--c1:#f6c768;--c2:#fff" opacity=".35"/>
            <use href="#bottle-round" x="650" y="90" width="140" height="140" style="--c1:#fff;--c2:#e6a23c" opacity=".28"/>
            <use href="#bottle-flat" x="500" y="120" width="90" height="90" style="--c1:#e6a23c;--c2:#fff" opacity=".3"/>
            <g fill="#fff">
                <circle cx="330" cy="50" r="3" opacity=".6"/><circle cx="380" cy="100" r="2" opacity=".5"/>
                <circle cx="260" cy="150" r="2.5" opacity=".5"/><circle cx="480" cy="40" r="2" opacity=".6"/>
                <path d="M610 30l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".6"/>
                <path d="M300 190l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".5"/>
            </g>
        </g>
        <!-- Wallpaper halaman (lembut, di belakang konten) -->
        <g id="pgbg">
            <circle cx="120" cy="140" r="220" style="fill:var(--pri)" opacity=".06"/>
            <circle cx="1280" cy="700" r="300" style="fill:var(--acc)" opacity=".08"/>
            <circle cx="900" cy="60" r="140" style="fill:var(--pri)" opacity=".05"/>
            <use href="#bottle-round" x="1120" y="40" width="200" height="200" style="--c1:var(--pri);--c2:var(--acc)" opacity=".07"/>
            <use href="#bottle-tall" x="30" y="520" width="240" height="240" style="--c1:var(--pri);--c2:var(--acc)" opacity=".06"/>
            <path d="M0 640 C300 560 520 760 860 650 S1240 560 1440 640" fill="none" style="stroke:var(--pri)" stroke-opacity=".12" stroke-width="2"/>
        </g>
    </defs>
</svg>
<svg class="pgbg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#pgbg"/></svg>
<header><div class="nav" id="nav"></div></header>
<main id="app"></main>
<div id="toast" role="status"></div>

<!-- Pengaturan wallpaper: pilih tema, atau unggah gambar sendiri -->
<button class="wp-btn" id="wp-btn" type="button" aria-expanded="false" aria-controls="wp-panel"></button>
<div class="wp-panel" id="wp-panel" hidden>
    <b>Ganti wallpaper</b>
    <div class="wp-sw" id="wp-sw"></div>
    <div class="wp-act">
        <label class="btn g s" for="wp-file">Unggah gambar</label>
        <input type="file" id="wp-file" accept="image/*" hidden>
        <button class="btn g s" id="wp-reset" type="button">Default</button>
    </div>
    <small class="mut" id="wp-msg">Berlaku untuk banner dasbor, hero, dan latar halaman.</small>
</div>
<script src="script.js"></script>
</body>
</html>
